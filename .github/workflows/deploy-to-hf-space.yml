name: Mirror to HF Space

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

concurrency:
  group: deploy-space
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------------------------------------
      # IMPORTANTE (Opción A):
      # - Este workflow EXCLUYE archivos pesados/binaros (.pt, .faiss, .pdf, etc.) del push.
      # - Sube MANUALMENTE a Hugging Face (modelo/dataset/space) los siguientes:
      #     • El modelo (.pt / pesos)        -> p.ej. a un Model repo en HF
      #     • Los PDFs grandes               -> p.ej. a un Dataset repo o storage separado
      #     • El índice FAISS (.faiss)       -> si prefieres no reconstruir al arrancar
      #   En el Space, tu app debe reconstruir el índice si no existe (primer arranque más lento).
      # ---------------------------------------------------------------------------------------

      - name: Push to Hugging Face Space (exclude big binaries; build FAISS at runtime)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${HF_SPACE_REPO:-}" ]; then
            HF_SPACE_REPO="Barearojojuan/MonoAgent"
          fi

          # Snapshot limpio con exclusiones
          rm -rf _space_out
          mkdir -p _space_out

          rsync -a ./ _space_out \
            --exclude '.git' \
            --exclude '.gitattributes' \
            --exclude '.gitmodules' \
            --exclude '.env' \
            --exclude '.venv' \
            --exclude '__pycache__' \
            --exclude '.pytest_cache' \
            --exclude 'cajon_ de sastre' \
            --exclude 'data/corpus' \
            --exclude 'labels.json' \
            --exclude '*.pt' \
            --exclude '*.bin' \
            --exclude '*.onnx' \
            --exclude '*.pdf' \
            --exclude '*.faiss'

          cd _space_out

          # Init y push a Space
          git init
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -m "Deploy (excluding big binaries: .pt, .pdf, .faiss; build index at runtime)"
          git branch -M main
          git remote add origin https://huggingface.co/spaces/${HF_SPACE_REPO}
          git push -f origin main
